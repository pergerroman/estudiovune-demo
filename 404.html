<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b3321">
    <meta name="robots" content="noindex, follow, nosnippet">
    <title>Página no encontrada | Vuné</title>
    <meta name="description" content="La página solicitada no existe. Volvé al inicio del sitio de Vuné.">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/src/logos/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Averia+Gruesa+Libre&amp;family=Inter:opsz,wght@14..32,300..900&amp;display=swap">
    <link rel="stylesheet" href="/css/404.css">
</head>
<body>
    <header class="error-header">
        <a class="error-header__logo" href="/" aria-label="Ir al inicio de Vuné">
            <img src="/src/logos/vune-logo.svg" alt="Vuné">
        </a>
        <nav class="error-header__menu" aria-label="Navegación de error">
            <a href="/">HOME</a>
            <a href="/#contacto">CONTACTO</a>
        </nav>
    </header>
    <main class="error-page">
        <div class="error-page__wrap">
            <div class="error-page__content">
                <p class="error-page__eyebrow">Error 404</p>
                <h1>Esta página no existe.</h1>
                <p>
                    Quizás cambió de lugar o la dirección no es correcta.
                    Volvamos a mirar desde el inicio.
                </p>
                <a class="error-page__button" href="/">Volver al inicio</a>
            </div>
        </div>
    </main>
</body>
</html>
